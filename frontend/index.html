<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hot Chocolate Sales Predictor</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Hot Chocolate Sales Predictor</h1>

        <p>Enter the weather conditions to predict hot chocolate sales.</p>

        <form id="predictionForm">

            <label for="temperature">Temperature (°C)</label>
            <input type="number" id="temperature" required>

            <label for="humidity">Humidity (%)</label>
            <input type="number" id="humidity" required>

            <label for="wind_speed">Wind Speed (km/h)</label>
            <input type="number" id="wind_speed" required>

            <label for="is_weekend">Is it a weekend?</label>
            <select id="is_weekend" required>
                <option value="0">No</option>
                <option value="1">Yes</option>
            </select>

            <button type="submit">Predict Sales</button>



        </form>

        <div id="result"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
